<style>

[data-theme=dark],[data-theme=amoled],[data-theme=ocean],[data-theme=sunset],[data-theme=forest],[data-theme=lavender]{--bc:var(--line);--cb:var(--line);--bw:1px;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);--cs:var(--sh);--grid:color-mix(in srgb,var(--ink) 7%,transparent);--hbg:linear-gradient(135deg,var(--accent),var(--a2));--hfg:#fff;--hb:rgba(255,255,255,.4);--gb:rgba(255,255,255,.18);--hp:22px;--hsh:var(--sh);--ringbg:rgba(255,255,255,.16);--rbc:transparent;--rsh:none;--ringc:#fff;--ringt:rgba(255,255,255,.3);--fh:Sora,Georgia,serif;--fb:"DM Sans",system-ui,sans-serif}[data-theme=dark],[data-theme=amoled]{--hfg:#0b1020;--gb:rgba(255,255,255,.3);--sh:0 6px 20px rgba(0,0,0,.4);--cs:var(--sh)}[data-theme=amoled]{--bg:#000;--card:#0a0a0a;--ink:#f2f2f2;--mute:#8a8a8a;--line:#222;--accent:#a78bfa;--a2:#38bdf8;--onacc:#000;--hfg:#000;--office:#12263d;--half:#463a0c;--full:#4a1f26;--off:#121212;--warn:#ff6b6b;--ok:#4ade80;--sh:none;--cs:none;--ringt:rgba(0,0,0,.25);--ringc:#000;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
body{margin:0;font-family:var(--fb);color:var(--ink);background-color:var(--bg);background-size:28px 28px;line-height:1.5}
h1,h2,h3,.big{font-family:var(--fh);margin:0;letter-spacing:-.02em}
.wrap{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:calc(var(--r) - 4px);padding:7px 13px;font-weight:600;transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,.day:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button.pri{background:linear-gradient(135deg,var(--accent),var(--a2));color:var(--onacc);border:0}
button.ghost,a.ghost{background:var(--gb);color:var(--hfg);border:1.5px solid var(--hb);border-radius:calc(var(--r) - 4px);padding:7px 13px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}a.lnk{display:inline-block;margin-top:10px;color:var(--accent);font-weight:600}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
.hero{border-radius:calc(var(--r) + 8px);padding:var(--hp);color:var(--hfg);background:var(--hbg);display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;box-shadow:var(--hsh)}

.hero h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;line-height:1.1}.hero .s{opacity:.9;margin-top:6px;max-width:560px}
.hbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.hbar select{width:auto;background:var(--gb);color:inherit;border:1.5px solid var(--hb)}.hbar option{color:#111}
.ringbox{display:flex;align-items:center;gap:14px;background:var(--ringbg);border:var(--bw) solid var(--rbc);box-shadow:var(--rsh);border-radius:var(--r);padding:12px 16px}
.ring{width:84px;height:84px;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--fh)}
.big{font-size:30px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);border:var(--bw) solid var(--bc)}
.stat b{font:800 28px/1.1 var(--fh);display:block}.stat span{color:var(--mute);font-size:.85rem}.stat.bad{--c:var(--warn)}.stat.bad b{color:var(--warn)}
.alert{background:var(--half);border:var(--bw) solid var(--bc);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--cs);border:var(--bw) solid var(--cb);margin-bottom:14px}
.meter{display:flex;gap:4px;margin-top:8px}.meter i{flex:1;height:16px;border-radius:6px;background:var(--off)}
.meter i.f{background:var(--warn)}.meter i.h{background:linear-gradient(90deg,var(--warn) 50%,var(--off) 50%)}.meter i.p{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,transparent 4px 8px);opacity:.7}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;padding-bottom:2px}.tabs button{white-space:nowrap;border-radius:99px}.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px;font-size:.85rem;color:var(--mute)}.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;background:var(--c)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}@media(max-width:900px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:10px}@media(max-width:900px){.side{position:static}}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head div{text-align:center;color:var(--mute);font-size:.8rem;font-weight:600;padding-bottom:3px}
.month{margin-bottom:18px}.month h3{font-size:20px;margin:2px 0 8px}
.day{min-height:var(--ch,84px);border-radius:calc(var(--r) - 4px);border:1.5px solid transparent;padding:5px 6px;background:var(--off);position:relative;font-size:.78rem;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;user-select:none;transition:transform .12s,box-shadow .12s}
.dense .day{min-height:58px}.day:hover{transform:translateY(-2px);box-shadow:var(--sh)}.day.blank{background:none;pointer-events:none;box-shadow:none}
.day .n{font-weight:700;font-size:.95rem}.day.s-office{background:var(--office)}.day.s-half{background:var(--half)}.day.s-full{background:var(--full)}
.day.sun .n{color:var(--warn)}.nosun .day.sun .n{color:inherit}
.day.exam{background:linear-gradient(135deg,var(--accent),var(--a2));color:var(--onacc)}.day.exam .n{color:inherit}
.day.sel{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}.day.today .n:after{content:" · today";font-weight:500;font-size:.65rem}
.day .x{font-weight:700;line-height:1.15}.day .h{margin-top:auto;opacity:.7;font-size:.72rem}.noh .day .h{display:none}
.day .w{position:absolute;right:4px;top:4px;font-size:.65rem;background:var(--ink);color:var(--card);border-radius:99px;padding:0 6px}
.day .c{position:absolute;right:5px;bottom:3px;color:var(--warn);font-weight:800;font-size:1rem}.exam .c{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:var(--off);border-radius:99px;padding:2px 11px;font-size:.8rem;font-weight:600}
.chip.bud{cursor:pointer;background:var(--office)}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1}.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.plan{padding-left:18px;margin:6px 0}.warn{color:var(--warn);font-weight:600}.ok{color:var(--ok);font-weight:600}.mute{color:var(--mute)}
label.l{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 3px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}.pbar{height:8px;background:var(--off);border-radius:9px;overflow:hidden;min-width:70px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--a2))}
.tag{padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--off)}.tag.t{background:var(--full)}.tag.g{background:#d1fae5;color:#065f46}[data-theme=dark] .tag.g,[data-theme=amoled] .tag.g{background:#064e3b;color:#a7f3d0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.wd{display:flex;gap:6px;flex-wrap:wrap}.wd label{background:var(--off);border-radius:99px;padding:3px 11px;display:flex;gap:5px;align-items:center}.wd input{width:auto}
.subj{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}.subj .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.topic{display:flex;gap:8px;align-items:center;padding:2px 0}.topic input[type=checkbox]{width:auto}.topic.d span{text-decoration:line-through;color:var(--mute)}.topic button{padding:0 8px}
.mini{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:.8rem;color:var(--mute)}.mini b{color:var(--ink)}
.gantt{display:grid;gap:3px;font-size:.7rem;min-width:max-content}.gantt .gr{display:flex;gap:2px;align-items:center}.gantt .gl{width:130px;flex:none;font-weight:600;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc{width:22px;height:22px;border-radius:5px;background:var(--off);display:grid;place-items:center;flex:none;font-size:.65rem;color:var(--mute)}
.gc.p{background:color-mix(in srgb,var(--accent) 28%,var(--card))}.gc.x{background:var(--accent);color:var(--onacc);font-weight:700}.gc.l{box-shadow:inset 0 -3px 0 var(--warn)}.gc.sn{opacity:.5}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}.heat div{border-radius:8px;padding:4px;font-size:.7rem;text-align:center;background:color-mix(in srgb,var(--accent) var(--p),var(--card))}
.bars .br{display:grid;grid-template-columns:140px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:.85rem}.bars .tr{height:12px;background:var(--off);border-radius:9px;position:relative}.bars .tr i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.sug{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
dialog{max-width:640px;width:calc(100% - 24px);border:0;border-radius:calc(var(--r) + 6px);background:var(--card);color:var(--ink);padding:20px;max-height:88vh;box-shadow:var(--sh)}dialog::backdrop{background:rgba(0,0,0,.45)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.themes button{padding:8px;text-align:left}.themes button.on{outline:3px solid var(--accent)}.themes i{display:block;height:20px;border-radius:6px;margin-bottom:5px}
.dots{display:flex;gap:6px}.dots button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff}
.sw{display:flex;gap:10px;align-items:center;margin:8px 0}.sw input[type=checkbox]{width:auto}.sw input[type=range]{padding:0}


#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
@media(max-width:600px){.bars .br{grid-template-columns:90px 1fr 70px}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 30%,transparent)}}@keyframes blink{50%{opacity:.3}}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.2}}.enter .day{animation:pop .4s both}.fx .day.today{animation:pulse 2.4s infinite}.fx .day .c{animation:blink 1.2s infinite}.fx .day.exam:hover{transform:translateY(-3px) rotate(-1.2deg)}.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:20;pointer-events:none;animation:fall 2.2s ease-in forwards}.strip{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;padding:2px 2px 8px}.sc{flex:none;min-width:150px;background:var(--card);border:var(--bw) solid var(--bc);border-radius:var(--r);padding:8px 12px;box-shadow:var(--sh);font-size:.85rem}.sc b{font:800 22px/1.1 var(--fh);display:block}.sc.urgent{border-color:var(--warn)}.sc.urgent b{color:var(--warn)}.chk{display:flex;gap:8px;align-items:center;padding:1px 0}.chk input{width:auto}.leave{background:var(--off);border-radius:10px;padding:6px 10px;margin:8px 0;font-size:.85rem}.row2{display:grid;grid-template-columns:1fr 70px auto;gap:6px;margin-top:6px}

:root{--ca:var(--accent);--cb2:var(--accent);--cf:#fff;--hgrid:none;--hem1:var(--accent);--hem2:var(--accent);--hbd:transparent}
[data-theme=dark],[data-theme=amoled],[data-theme=ocean],[data-theme=sunset],[data-theme=forest],[data-theme=lavender]{--hp:30px 28px;--hfg:#fff;--gb:rgba(255,255,255,.07);--hb:rgba(255,255,255,.16);--ringbg:rgba(255,255,255,.06);--rbc:rgba(255,255,255,.16);--ringt:rgba(255,255,255,.16);--ringc:#fff;--ca:#fff;--cb2:#e9ecff;--cf:#0b0f1a;--hbd:rgba(255,255,255,.12);--hem1:color-mix(in srgb,var(--accent) 45%,#fff);--hem2:color-mix(in srgb,var(--a2) 45%,#fff);--hbase:color-mix(in srgb,var(--ink) 94%,var(--accent));--hgrid:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);--hbg:radial-gradient(620px 300px at 6% -10%,color-mix(in srgb,var(--accent) 75%,transparent),transparent 70%),radial-gradient(560px 340px at 100% 110%,color-mix(in srgb,var(--a2) 60%,transparent),transparent 70%),var(--hbase)}
[data-theme=dark]{--hbase:#0a0e1c}[data-theme=amoled]{--hbase:#000;--hbd:rgba(167,139,250,.35)}

.hero>*{position:relative}.hl{flex:1;min-width:280px;display:flex;flex-direction:column;align-items:flex-start}

a.hub{border-radius:99px;padding:9px 16px}

 <label class="l">Working days in immersion</label><div class="wd">${DN.map((n,i)=>`<label><input type="checkbox" data-wd="${i}" ${S.work.includes(i)?"checked":""}>${n}</label>`).join("")}</div></div>
 <div class="g3">${S.exams.map((e,i)=>{const w=win(e),h=w.reduce((a,d)=>a+hrs(d),0),t=S.topics[e.id]||[];return `<div class="subj"><input data-e="${i}" data-f="name" value="${esc(e.name)}" aria-label="Subject name" style="font-weight:700">
 <div class="row"><input type="date" data-e="${i}" data-f="date" value="${e.date}" aria-label="Exam date"><input type="time" data-e="${i}" data-f="time" value="${e.time}" aria-label="Exam time"><input data-e="${i}" data-f="type" value="${esc(e.type)}" aria-label="Type">
 <select data-e="${i}" data-f="kind" aria-label="Kind"><option value="theory" ${e.kind==="theory"?"selected":""}>Theory</option><option value="practical" ${e.kind==="practical"?"selected":""}>Practical</option></select>
 <input type="number" data-e="${i}" data-f="target" value="${e.target}" aria-label="Target hours" title="Target prep hours"><select data-e="${i}" data-f="diff" aria-label="Difficulty">${[1,2,3].map(n=>`<option value="${n}" ${+e.diff===n?"selected":""}>${["","Easy","Medium","Hard"][n]}</option>`).join("")}</select></div>
 <div class="mini">${e.date?`<span><b>${diff(e.date,TODAY)}</b> days left</span><span><b>${free(w)}</b> free days</span><span><b>${leavesIn(w)}</b> leaves</span><span><b>${h}h</b> available of ${e.target}h</span>`:'<span class="warn">Date not announced. 1 leave is held for this.</span>'}<span><b>${studied(e)}h</b> studied of ${e.target}h</span></div>
 <div class="pbar"><i style="width:${pct(e)}%"></i></div><div class="mini">Syllabus ${pct(e)}%</div>
 ${t.map((x,j)=>`<div class="topic ${x.d?"d":""}"><input type="checkbox" data-te="${e.id}" data-j="${j}" ${x.d?"checked":""} aria-label="done"><span style="flex:1">${esc(x.t)}</span><button data-del="${e.id}:${j}" aria-label="delete topic">x</button></div>`).join("")}
 <input data-add="${e.id}" placeholder="Add a topic, press Enter" style="margin-top:6px"><button data-rm="${i}" style="margin-top:8px">Remove subject</button></div>`}).join("")}</div>
 <button class="pri" id="ae">Add subject</button>
 <div class="card" style="margin-top:14px"><h3>Prep plan by subject</h3><div class="scroll"><table><thead><tr><th>Subject</th><th>Exam</th><th>Days left</th><th>Prep days</th><th>Free days</th><th>Leaves</th><th>Prep hours</th><th>Status</th><th>Syllabus</th></tr></thead><tbody>${dated().map(e=>{const w=win(e),past=e.date<TODAY,h=w.reduce((a,d)=>a+hrs(d),0);return `<tr><td><b>${esc(e.name)}</b><br><span class="mute">${esc(e.type)}</span></td><td>${fmt(e.date)}<br><span class="mute">${e.time}</span></td><td>${past?'<span class="tag">Done</span>':diff(e.date,TODAY)}</td><td>${past?"-":w.length}</td><td>${past?"-":free(w)}</td><td>${leavesIn(w)+(def(e.date)==="office"?cost(S.ov[e.date]):0)}</td><td>${past?"-":h+"h"}</td><td>${past?"":`<span class="tag ${h>=e.target?"g":"t"}">${h>=e.target?"On track":"Short "+(e.target-h)+"h"}</span>`}</td><td><div class="pbar"><i style="width:${pct(e)}%"></i></div>${pct(e)}%</td></tr>`}).join("")}${S.exams.filter(e=>!e.date).map(e=>`<tr><td><b>${esc(e.name)}</b></td><td colspan="8" class="warn">Date to be announced. 1 leave held.</td></tr>`).join("")}</tbody></table></div></div>`;
 const V=$("#view");
 V.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{const o=x.dataset.e!==undefined?S.exams[x.dataset.e]:S,p=x.dataset.f.split(".");let t=o;while(p.length>1)t=t[p.shift()];t[p[0]]=x.type==="number"?+x.value:x.value;save();render()});
 V.querySelectorAll("[data-wd]").forEach(x=>x.onchange=()=>{S.work=[...V.querySelectorAll("[data-wd]:checked")].map(c=>+c.dataset.wd);save();render()});
 V.querySelectorAll("[data-te]").forEach(c=>c.onchange=()=>{const t=S.topics[c.dataset.te];t[c.dataset.j].d=c.checked;save();render();if(c.checked&&t.every(x=>x.d)){boom();toast("Syllabus complete for this subject!")}});
 V.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const[id,j]=b.dataset.del.split(":");S.topics[id].splice(j,1);save();render()});
 V.querySelectorAll("[data-add]").forEach(i=>i.onkeydown=ev=>{if(ev.key==="Enter"&&i.value.trim()){const id=i.dataset.add;(S.topics[id]=S.topics[id]||[]).push({t:i.value.trim(),d:false});save();render()}});
 V.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.exams.splice(b.dataset.rm,1);save();render()});
 $("#ae").onclick=()=>{S.exams.push(ex("n"+Date.now(),"New subject","","Core","theory",20,2));save();render()}}
function suggest(){const out=[];dated().filter(e=>e.kind==="theory"&&e.date>TODAY).forEach(e=>{const w=win(e),h=w.reduce((a,d)=>a+hrs(d),0),def_=e.target-h;if(def_>0)w.filter(d=>st(d)==="office"&&!exOn(d).length).reverse().slice(0,2).forEach(d=>out.push({d,e,def_,gain:S.rates.free-S.rates.office}))});return out.sort((a,b)=>b.def_-a.def_).slice(0,5)}
function vIns(){
 const l=dated().filter(e=>e.date>=TODAY),end=l.length?l[l.length-1].date:TODAY,days=[];for(let d=TODAY;d<=end&&days.length<90;d=addD(d,1))days.push(d);
 const tot=days.reduce((a,d)=>a+hrs(d),0),od=days.filter(d=>st(d)==="office").length,fd=days.filter(d=>["off","full"].includes(st(d))).length,sg=suggest();
 let best=0,run=0;days.forEach(d=>{if(["off","full"].includes(st(d))){run++;best=Math.max(best,run)}else run=0});
 const hs=S.exams.filter(e=>e.kind==="theory"&&e.date>=TODAY).map(e=>({e,h:win(e).reduce((a,d)=>a+hrs(d),0)}));
 $("#view").innerHTML=`<div id="insw" class="wcol"><div class="stats" data-w="tiles"><div class="stat"><b>${tot}h</b><span>Total prep hours ahead</span></div><div class="stat"><b>${fd}</b><span>Free study days</span></div><div class="stat"><b>${od}</b><span>Office days left</span></div><div class="stat"><b>${best}</b><span>Longest free stretch (days)</span></div></div>
 <div class="card" data-w="heat"><h3>Prep hours by day</h3><div class="heat" style="margin-top:10px">${days.map(d=>`<div style="--p:${Math.min(80,hrs(d)*10)}%" title="${fmt(d)}">${pd(d).getDate()}<br>${hrs(d)}h</div>`).join("")}</div></div>
 <div class="card bars" data-w="bars"><h3>Hours available vs target</h3>${hs.map(({e,h})=>`<div class="br"><span>${esc(e.name)}</span><div class="tr"><i style="width:${Math.min(100,100*h/e.target)}%;${h<e.target?"background:var(--warn)":""}"></i></div><span>${h}h / ${e.target}h</span></div>`).join("")||'<span class="mute">No upcoming theory exams.</span>'}</div>
 <div class="card" data-w="sug"><h3>Smart leave suggestions</h3><p class="mute">Office days that would add the most study time for subjects that are short on hours.</p>${sg.map((x,i)=>`<div class="sug"><span>Take <b>${fmt(x.d)}</b> off for ${esc(x.e.name)} (+${x.gain}h, short by ${x.def_}h)</span><button data-a="${i}">Apply full leave</button></div>`).join("")||'<span class="ok">Every subject has enough prep time.</span>'}</div>${slCard()}</div>`;
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>setS(sg[b.dataset.a].d,"full"));$("#lr").onclick=()=>navigator.clipboard.writeText(leaveReq()).then(()=>toast("Leave request copied"),()=>toast("Copy blocked by the browser."));applyW("#insw",INSW,S.ins)}
function auto(){snap();S.ov={};let left=S.cap-reserved()-S.spare;const ds=dated().filter(e=>def(e.date)==="office");
 ds.forEach(e=>{const c=e.kind==="practical"?"full":"half";S.ov[e.date]=c;left-=cost(c)});
 let th=dated().filter(e=>e.kind==="theory"&&e.date>TODAY);if(S.strat==="hard")th.sort((a,b)=>b.diff-a.diff||a.date.localeCompare(b.date));
 for(let k=1;k<=(S.strat==="last"?1:7);k++)th.forEach(e=>{const d=addD(e.date,-k);if(left>=1&&d>=TODAY&&def(d)==="office"&&!exOn(d).length&&!S.ov[d]){S.ov[d]="full";left--}});
 save();render();toast(`Auto-planned. ${S.cap-used()-reserved()} leaves free.`);if(!clashes().length)boom()}
function cust(){const D=$("#dlg");
 D.innerHTML=`<h2>Customise</h2><label class="l">Theme</label><div class="themes">${[["white","#f5f7f3","Paper (classic)"],["dark","#141a2e","Midnight"],["amoled","#000","AMOLED black"],["ocean","#0284c7","Ocean"],["sunset","#ea580c","Sunset"],["forest","#15803d","Forest"],["lavender","#7c3aed","Lavender"]].map(([k,c,n])=>`<button data-t="${k}" class="${S.theme===k?"on":""}"><i style="background:${c}"></i>${n}</button>`).join("")}</div>
 <div class="sw"><label>Accent colour</label><input type="color" id="ac" value="${S.accent||"#4f46e5"}" style="width:60px;padding:2px"><button id="ar">Use theme colour</button></div>
 <div class="sw"><label>Corner roundness</label><input type="range" id="rd" min="4" max="26" value="${S.radius}"></div>
 <div class="sw"><label>Text size</label><input type="range" id="fs" min="13" max="19" value="${S.fs}"></div>
 <div class="sw"><label>Font style</label><select id="ft" style="width:auto"><option value="theme">Theme default</option><option value="classic">Classic</option><option value="modern">Modern</option><option value="serif">Serif</option><option value="mono">Mono</option></select></div><div class="sw"><label>Background</label><select id="bgs" style="width:auto"><option value="auto">Auto</option><option value="grid">Graph paper</option><option value="dots">Dots</option><option value="plain">Plain</option></select></div><div class="sw"><label>Day cell height</label><input type="range" id="ch" min="56" max="120" value="${S.ch}"></div><div class="sw"><input type="checkbox" id="fxk" ${S.fx?"checked":""}><label for="fxk">Animations and effects</label></div><div class="sw"><input type="checkbox" id="cfk" ${S.conf?"checked":""}><label for="cfk">Confetti celebrations</label></div>
 <div class="sw"><label>Week starts on</label><select id="wk" style="width:auto"><option value="0">Sunday</option><option value="1">Monday</option></select></div>
 <div class="sw"><input type="checkbox" id="dn" ${S.dense?"checked":""}><label for="dn">Compact calendar</label></div>
 <div class="sw"><input type="checkbox" id="sh" ${S.showH?"checked":""}><label for="sh">Show prep hours on days</label></div>
 <div class="sw"><input type="checkbox" id="su" ${S.sun?"checked":""}><label for="su">Highlight Sundays in red</label></div>
 ${lookUI()}${wUI("Dashboard widgets","dash",DASH)}${wUI("Insights widgets","ins",INSW)}<label class="l">Backup (copy to save, paste to restore)</label><textarea id="bk" rows="3">${esc(JSON.stringify(S))}</textarea>
 <div class="seg"><button id="ld">Load backup</button><button id="wp">Reset everything</button><button class="pri" id="cl">Done</button></div>`;
 D.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();render();cust()});
 const on=(id,f)=>$(id).oninput=e=>{f(e.target);save();render()};
 on("#ft",e=>S.font=e.value);on("#bgs",e=>S.bg=e.value);on("#ch",e=>S.ch=+e.value);on("#fxk",e=>S.fx=e.checked);on("#cfk",e=>S.conf=e.checked);$("#ft").value=S.font;$("#bgs").value=S.bg;on("#ac",e=>S.accent=e.value);on("#rd",e=>S.radius=+e.value);on("#fs",e=>S.fs=+e.value);on("#dn",e=>S.dense=e.checked);on("#sh",e=>S.showH=e.checked);on("#su",e=>S.sun=e.checked);on("#wk",e=>S.wk=+e.value);$("#wk").value=S.wk;
 $("#ar").onclick=()=>{S.accent="";save();render();cust()};
 $("#lks").onclick=()=>{const n=$("#lkn").value.trim()||"Look "+(S.looks.length+1),k={name:n};LK.forEach(x=>k[x]=S[x]);S.looks.push(k);save();cust()};
 D.querySelectorAll("[data-la]").forEach(b=>b.onclick=()=>{const k=S.looks[b.dataset.la];LK.forEach(x=>{if(k[x]!==undefined)S[x]=k[x]});save();render();cust()});
 D.querySelectorAll("[data-ld]").forEach(b=>b.onclick=()=>{S.looks.splice(b.dataset.ld,1);save();cust()});
 D.querySelectorAll("[data-wv]").forEach(c=>c.onchange=()=>{const[k,id]=c.dataset.wv.split(":");S[k].hide=S[k].hide||{};S[k].hide[id]=!c.checked;save();render()});
 D.querySelectorAll("[data-wm]").forEach(b=>b.onclick=()=>{const[k,i,dr]=b.dataset.wm.split(":"),list=k==="dash"?DASH:INSW,o=(S[k].order&&S[k].order.length?S[k].order:list.map(x=>x[0])).slice(),j=+i+ +dr;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];S[k].order=o;save();render();cust()});
 $("#ld").onclick=()=>{try{S=Object.assign(structuredClone(DEF),JSON.parse($("#bk").value));save();render();toast("Backup loaded")}catch(e){toast("That backup text is not valid.")}};
 $("#wp").onclick=()=>{if(confirm("Reset all subjects, leaves and notes?")){S=structuredClone(DEF);save();render();D.close()}};$("#cl").onclick=()=>D.close();D.showModal()}
function summary(){const ls=Object.keys(S.ov).sort().filter(d=>def(d)==="office").map(d=>`${fmt(d)}: ${S.ov[d]} day`);
 return `Semester 3 plan${S.profile.name?" for "+S.profile.name:""}\nLeaves: ${used()} used, ${reserved()} held for practicals, ${S.cap-used()-reserved()} free of ${S.cap}\nExams:\n${dated().map(e=>`${fmt(e.date)} ${e.name} (${e.type})`).join("\n")}\nLeave days:\n${ls.join("\n")||"None"}`}
$("#auto").onclick=auto;$("#strat").onchange=e=>{S.strat=e.target.value;save()};$("#reset").onclick=()=>{snap();S.ov={};save();render();toast("Leaves cleared")};
$("#undo").onclick=()=>{if(!H.length)return toast("Nothing to undo");S.ov=JSON.parse(H.pop());save();render()};$("#cust").onclick=cust;$("#shr").onclick=share;$("#ics").onclick=icsDlg;
$("#copy").onclick=()=>{navigator.clipboard.writeText(summary()).then(()=>toast("Summary copied"),()=>toast("Copy blocked. Use the backup box in Customise."))};
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||S.tab!=="cal"||e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase(),mv={arrowleft:-1,arrowright:1,arrowup:-7,arrowdown:7}[k];
 if(mv){e.preventDefault();sel=addD(sel,mv);render()}else if(k==="t"){sel=TODAY;render()}else if({o:"office",h:"half",f:"full"}[k])setS(sel,{o:"office",h:"half",f:"full"}[k])});
render();
</script></body></html>
